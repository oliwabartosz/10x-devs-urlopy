name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx astro sync

      - name: Lint
        run: npm run lint

      - name: Lint shell
        # install.sh is the whole install story on an offline box, where a typo cannot be fixed by
        # pushing a patch, so it is linted like source. shellcheck is a devDependency rather than
        # a runner-image assumption, so this gate behaves identically here and on a laptop.
        run: npm run lint:sh

      - name: Test
        # A real gate now. The suites used to self-skip (describe.skipIf) unless DATABASE_URL_DIRECT
        # was set, so a green run meant "skipped" — see the note that used to live here. Each test
        # file now creates its own temp SQLite database (src/tests/helpers/setup.ts), so there is
        # nothing to configure and nothing to skip.
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          # Not a real origin: CI never serves this build to a browser, and leaving PUBLIC_ORIGIN
          # unset is the case the smoke test below needs anyway — astro.config.mjs then trusts
          # localhost and 127.0.0.1, which is exactly where the smoke test connects. A VPS build
          # sets it (see INSTALL.md); this one deliberately does not.
          DATABASE_PATH: ./ci.db
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Smoke test the built server
        # Inherited from the old post-deploy health check, which ran against the Cloudflare
        # deployment. There is no deployment to check any more — the VPS is offline and CI cannot
        # reach it — but the assertions are worth more than the target was, so they now run against
        # a server started right here. Everything below the startup block is unchanged.
        run: |
          set -euo pipefail
          node dist/bootstrap.mjs
          HOST=127.0.0.1 PORT=4321 node dist/server/entry.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          DEPLOY_URL="http://127.0.0.1:4321"
          echo "Health check: ${DEPLOY_URL}/"
          HTTP_CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 30 --retry 10 --retry-delay 2 --retry-connrefused \
            "${DEPLOY_URL}/")
          if [ "$HTTP_CODE" -ge 500 ]; then
            echo "FAIL: HTTP ${HTTP_CODE}"
            cat /tmp/body.txt
            exit 1
          fi
          # The exact strings tests/e2e/setup/auth.setup.ts resolves its locators against.
          # The previous check grepped for "sign.in\|email\|login", which id="email" in the
          # markup satisfied — so it stayed green straight through f748ba5 Polonizing the
          # form and left the E2E suite broken for a day. The label->input bindings are
          # included because that is what getByLabel actually resolves against; a bare
          # "Zaloguj się" is also produced by the card subheading, not just the button.
          #
          # -F is load-bearing: the literals are non-ASCII and must be byte-compared, not
          # read as regex. Do NOT add -i — case-folding non-ASCII is locale-dependent, and
          # -i would also make 'Hasło' vacuous by matching the placeholder "Wpisz hasło".
          for NEEDLE in 'Użytkownik / ID' 'Hasło' 'for="email"' 'for="password"'; do
            if ! grep -qF "$NEEDLE" /tmp/body.txt; then
              echo "FAIL: the signin page no longer contains the literal: ${NEEDLE}"
              echo "The E2E signin locators resolve against this string. If the copy changed"
              echo "on purpose, update tests/e2e/setup/auth.setup.ts (and the signin entry in"
              echo "tests/e2e/e2e-rules.md) in the same change."
              # Bounded: this repo is public, so the whole page lands in a world-readable log
              # on every copy edit. The missing literal is already named above.
              head -c 2000 /tmp/body.txt
              exit 1
            fi
          done
          # "Zaloguj się" is counted, not merely present. The card subheading
          # ("Zaloguj się, aby uzyskać dostęp do panelu", src/pages/auth/signin.astro)
          # already supplies one occurrence, so a presence grep would stay green even if the
          # submit button — the only thing getByRole in auth.setup.ts resolves against — were
          # renamed. Count occurrences, not lines: the response is minified onto two lines,
          # so both hits share a line and `grep -c` would report 1.
          SUBMIT_HITS=$(grep -oF 'Zaloguj się' /tmp/body.txt | wc -l)
          if [ "$SUBMIT_HITS" -lt 2 ]; then
            echo "FAIL: expected >=2 occurrences of 'Zaloguj się' (card subheading + submit"
            echo "button), found ${SUBMIT_HITS}. The submit button's accessible name is what"
            echo "tests/e2e/setup/auth.setup.ts clicks. If the copy changed on purpose, update"
            echo "that file (and the signin entry in tests/e2e/e2e-rules.md) in the same change."
            head -c 2000 /tmp/body.txt
            exit 1
          fi
          echo "OK: HTTP ${HTTP_CODE}"
        env:
          DATABASE_PATH: ./ci.db

      - name: Pack the offline artifact
        # Runs the exact command INSTALL.md tells a human to run, so the documented delivery step
        # is exercised on every push rather than the first time someone needs it.
        #
        # `npm run pack` fails if any compiled `*.node` binary ends up in the tarball. That is the
        # property the whole offline install rests on: node_modules is copied between machines
        # instead of reinstalled there, which only works while nothing in it is compiled. A
        # dependency that brings a native addon must fail here, not on the VPS at startup.
        #
        # Note this runs `npm prune --omit=dev`, so it must stay after every step that needs the
        # dev tooling.
        run: |
          set -euo pipefail
          npm prune --omit=dev
          URLOPY_RELEASE="${GITHUB_SHA::12}" npm run pack

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 1
# The `deploy` job that lived here is gone. It ran `wrangler deploy` against
# dist/server/wrangler.json, which this build no longer produces — the app targets a Node server
# behind nginx on an offline VPS (see INSTALL.md), and no CI runner can reach that machine.
# Deployment is a documented manual copy, deliberately.
#
# The bundle-size step went with it: it ran `wrangler deploy --dry-run` to check the Worker
# against Cloudflare's 3 MB gzip limit. A VPS has no such limit.
#
# The CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are now unused. They are
# left in place rather than revoked because `main` still deploys to Workers until this branch
# merges.
