# Urlopy — nginx server block.
#
# Placed BY HAND, unlike the systemd units: install.sh does not touch nginx (it cannot know
# whether this box already terminates TLS, which vhosts exist, or where the certificates live).
# Copy to /etc/nginx/conf.d/urlopy.conf (or sites-available + a symlink on Debian/Ubuntu), edit
# the three marked values, then `nginx -t && systemctl reload nginx`.
#
# EDIT THESE THREE:
#   server_name        -> the hostname in PUBLIC_ORIGIN
#   root               -> <app-root>/current/dist/client   (default: /opt/urlopy/current/dist/client)
#   proxy_pass         -> the loopback PORT from /etc/urlopy/env (default: 3000)

# ---------------------------------------------------------------------------------------------
# Plain HTTP. Correct for a closed internal network with no certificate authority; if you serve
# over HTTPS instead, use the commented block at the bottom and make sure PUBLIC_ORIGIN starts
# with https:// — that string is what drives the session cookie's Secure flag (src/lib/auth/
# session.ts) and Astro's allowedDomains protocol match (astro.config.mjs).
# ---------------------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name urlopy.internal;   # EDIT

    root /opt/urlopy/current/dist/client;   # EDIT

    # The app builds one XLSX export in memory; nothing else is large. Requests are small.
    client_max_body_size 2m;

    # --- Security headers ---------------------------------------------------------------------
    # These have no other source. There is no `_headers` file in this repo and never was — on
    # Cloudflare the edge supplied a baseline for free, and moving to nginx removed it. Everything
    # below is a header the app was getting implicitly and would otherwise silently lose.
    #
    # `always` matters: without it nginx omits the header on 4xx/5xx responses, which is exactly
    # where an error page's markup is most likely to be attacker-influenced.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # No camera/mic/geolocation anywhere in this app.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # 'unsafe-inline' for style-src is required: Astro emits inline <style> for scoped component
    # styles, and Tailwind's build output is linked but the island hydration inlines a little.
    # script-src stays strict — no inline scripts are emitted by this build.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Strict-Transport-Security is deliberately NOT set here — this block is plain HTTP, and an
    # HSTS header on http:// is both ignored and a trap if the host later gets a bad certificate.
    # It lives in the TLS block below instead.

    # --- Static assets ------------------------------------------------------------------------
    # Content-hashed by the Astro build, so they can be cached forever. Served straight off disk;
    # the Node process never sees these requests.
    location /_astro/ {
        expires max;
        add_header Cache-Control "public, immutable" always;
        # add_header inside a location REPLACES the whole inherited set rather than adding to it —
        # nginx's one genuinely surprising directive. Repeat the ones that still matter for a
        # static asset, or /_astro/ silently serves without them.
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Anything else that exists in dist/client (favicon, public/ passthrough) is served from disk;
    # everything else falls through to the app.
    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;   # EDIT if PORT is not 3000
        proxy_http_version 1.1;

        # THE TWO LOAD-BEARING HEADERS. Astro's security.checkOrigin compares the Origin header of
        # a non-safe form POST against the origin it computes from Host + forwarded proto. Get
        # either wrong and sign-in and sign-out (the only two FormData routes) return a bare 403
        # while every JSON route keeps working — which reads as "wrong password", not "proxy
        # misconfigured". See the allowedDomains comment in astro.config.mjs.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;

        # The sign-in rate limiter reads the first entry of X-Forwarded-For, falling back to
        # X-Real-IP (src/lib/auth/rate-limit.ts:47-54). Without these two the app sees no client
        # address at all and buckets every request under the literal string "unknown" — so one
        # person fat-fingering their password throttles sign-in for the whole office.
        #
        # $remote_addr, NOT the usual $proxy_add_x_forwarded_for: that variable *appends* to
        # whatever the client sent, so a client supplying its own X-Forwarded-For controls the
        # first entry — the exact value the limiter buckets on — and can rotate it per request to
        # walk straight past the throttle. Appending is right only when a trusted proxy sits in
        # front of this one; here nginx is the edge, so it overwrites.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Keepalive to the upstream: HTTP/1.1 defaults to `Connection: keep-alive`, but nginx
        # forwards the client's Connection header unless it is cleared here.
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------------------------
# TLS variant. Uncomment, drop the plain-HTTP server block above (or reduce it to the redirect),
# and set PUBLIC_ORIGIN to the https:// form in /etc/urlopy/env *and* at build time — the origin
# is baked into the artifact, so a mismatch needs a rebuild, not just a restart.
# ---------------------------------------------------------------------------------------------
# server {
#     listen 80;
#     listen [::]:80;
#     server_name urlopy.internal;   # EDIT
#     return 308 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name urlopy.internal;   # EDIT
#
#     ssl_certificate     /etc/ssl/certs/urlopy.crt;   # EDIT
#     ssl_certificate_key /etc/ssl/private/urlopy.key; # EDIT
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
#     # ...then the identical root / add_header / location blocks from the HTTP server above.
# }
