# Urlopy — location blocks for an nginx server{} you do NOT own.
#
# The sibling file urlopy.conf is a complete server block, for a host where Urlopy is the only
# thing served. This file is the other case: a shared box where nginx already answers for the
# hostname and serves other applications, and your access is "append to the existing config and
# ask for a reload". That is the rootless install's natural companion — see INSTALL.md,
# "Installing without root".
#
# PASTE THESE BLOCKS INSIDE THE EXISTING `server { ... }`. Do not create a second server block
# with the same server_name and listen: nginx warns "conflicting server name" and silently keeps
# only one of them, which is a confusing way to lose an afternoon.
#
# The mount path must match the PUBLIC_BASE_PATH the artifact was BUILT with (astro.config.mjs
# bakes it into every asset URL). Change one and you must rebuild, not just reload.
#
# EDIT: the upstream port, and the two paths if yours are not /urlopy and /nieobecnosci.

    # --- Urlopy, mounted at /urlopy ------------------------------------------------------------
    location /urlopy/ {
        # NO URI PART AFTER THE PORT. This is the one line to get wrong.
        #
        # `proxy_pass http://127.0.0.1:3001;` passes the request path through untouched, so the
        # app receives /urlopy/dashboard — which is what it expects, because PUBLIC_BASE_PATH put
        # /urlopy into every link, asset URL and redirect it emits.
        #
        # `proxy_pass http://127.0.0.1:3001/;` — with the trailing slash — would STRIP /urlopy/
        # and hand the app /dashboard. The page would still render, then every asset and every
        # fetch would 404 because the browser resolves them against /urlopy/. Note that the
        # /metabase/ block in this file deliberately uses the stripping form; Urlopy is the
        # opposite case, because it knows where it is mounted and Metabase does not.
        proxy_pass http://127.0.0.1:3001;   # EDIT to the PORT you passed to install-user.sh
        proxy_http_version 1.1;

        # --- Security headers -------------------------------------------------------------
        # These have no other source. On Cloudflare the edge supplied a baseline for free; nginx
        # is now the only thing that can. Scoped to this location rather than to the server
        # block, so nothing here changes the headers of the applications already living here.
        #
        # `always` matters: without it nginx omits the header on 4xx/5xx responses, which is
        # exactly where an error page's markup is most likely to be attacker-influenced.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        # 'unsafe-inline' for style-src is required: Astro emits inline <style> for scoped
        # component styles. script-src stays strict — this build emits no inline scripts.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # THE TWO LOAD-BEARING HEADERS. Astro's security.checkOrigin compares the Origin header
        # of a non-safe form POST against the origin it computes from Host + forwarded proto.
        # Get either wrong and sign-in and sign-out (the only two FormData routes) return a bare
        # 403 while every JSON route keeps working — which reads as "wrong password", not "proxy
        # misconfigured". See the allowedDomains comment in astro.config.mjs.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # $remote_addr, NOT the $proxy_add_x_forwarded_for used by the other applications in this
        # file. That variable *appends* to whatever the client sent, so a client supplying its own
        # X-Forwarded-For controls the first entry — and the first entry is exactly what
        # src/lib/auth/rate-limit.ts buckets sign-in attempts on, so it could be rotated per
        # request to walk straight past the throttle. Appending is correct only when a trusted
        # proxy sits in front of this one; here nginx is the edge, so it overwrites.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Keepalive to the upstream: HTTP/1.1 defaults to `Connection: keep-alive`, but nginx
        # forwards the client's Connection header unless it is cleared here.
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }

    # Bare /urlopy with no trailing slash. Without this it falls through to whatever handles `/`
    # — a 404 on this server — instead of reaching the app.
    location = /urlopy {
        return 301 /urlopy/;
    }

    # --- /nieobecnosci — the second link, an alias ----------------------------------------------
    # A redirect rather than a second mount, deliberately. Astro's `base` is a single value baked
    # into every emitted URL, so an app served under two prefixes would hand out links for one of
    # them no matter which door you came in by, and the session cookie's Path would match only
    # one. One canonical path plus a 301 keeps both links working with neither of those problems.
    location = /nieobecnosci {
        return 301 /urlopy/;
    }

    location /nieobecnosci/ {
        return 301 /urlopy/;
    }
