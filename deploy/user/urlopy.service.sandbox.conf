# Namespace-dependent hardening for the rootless urlopy.service.
#
# Installed as ~/.config/systemd/user/urlopy.service.d/10-sandbox.conf.
#
# Split out from the unit because every directive here needs the user manager to build a mount
# namespace, which in turn needs unprivileged user namespaces to be permitted on the host. Where
# they are not (a sysctl'd-down kernel, some hardened images), systemd fails the unit at start
# with a namespacing error rather than degrading — and on a box where you cannot become root to
# investigate, a service that will not start is far worse than one that starts less confined.
#
# install-user.sh starts the service with this file in place, and removes it and retries only if
# that fails. It tells you which of the two modes you ended in. To force the confined mode back
# on later: put this file back, `systemctl --user daemon-reload`, `systemctl --user restart urlopy`.
[Service]
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible

# Makes the whole hierarchy read-only, $HOME included — which is the point: the release directory
# and node_modules become unwritable to the process running out of them. ProtectHome is NOT used
# (it would hide the app itself, which lives in $HOME in this variant).
ProtectSystem=strict
# The one hole. WAL means the `-wal` and `-shm` sidecars are created next to the database, so the
# *directory* must be writable, not just the file.
ReadWritePaths=@DB_DIR@
