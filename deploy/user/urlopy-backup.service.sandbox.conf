# Namespace-dependent hardening for the rootless urlopy-backup.service.
# Installed as ~/.config/systemd/user/urlopy-backup.service.d/10-sandbox.conf.
# See the twin file for urlopy.service for why this is a drop-in and not part of the unit.
[Service]
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectSystem=strict
# The snapshot is taken through SQLite's online-backup API, which needs to *read* the live
# database and its WAL — hence @DB_DIR@ is writable here too (opening a WAL database touches the
# -shm file), on top of the directory the snapshot is written into.
ReadWritePaths=@DB_DIR@ @BACKUP_DIR@
PrivateNetwork=yes
